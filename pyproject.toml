[project]
name = "gunkata"
version = "0.3.0"
description = "Tools to improve security research workflows for Android devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Finn", email = "theskyabovetheport@bratanmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "python-xlib>=0.33",
    "pyyaml>=6.0",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/theskyabovetheport/gunkata"
Repository = "https://github.com/theskyabovetheport/gunkata"

[project.optional-dependencies]
frida = ["frida>=16"]

[project.scripts]
gunkata = "gunkata.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.16", "mkdocs>=1.6", "pyright>=1.1"]

[tool.pytest.ini_options]
markers = ["emulator: requires a live adb-attached Android device"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# __init__.py holds no logic but re-exports (root CLAUDE.md, Python Code
# Conventions); every name it imports is unused by definition.
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-bugbear]
# typer.Option/typer.Argument are Typer's own required signature-default
# idiom, not a mutable-default footgun.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
