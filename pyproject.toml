[project]
name = "gunkata"
version = "0.2.1"
description = "Tools to improve security research workflows for Android devices"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Finn", email = "theskyabovetheport@bratanmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/theskyabovetheport/gunkata"
Repository = "https://github.com/theskyabovetheport/gunkata"

[project.scripts]
gunkata = "gunkata.cli.main:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
markers = ["emulator: requires a live adb-attached Android device"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
