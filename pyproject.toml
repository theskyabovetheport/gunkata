[project]
name = "gunkata"
version = "0.1.0"
description = "Tools to improve security research workflows for Android devices"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["typer>=0.12"]

[project.scripts]
gunkata = "gunkata.main:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
markers = ["emulator: requires a live adb-attached Android device"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
